<svg width="1620" height="900" viewBox="0 0 1620 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Bot de comentarios · Bike Trust V2 — qué dice y cuándo</title><desc id="d">Recorrido del cliente por el bot de comentarios: cada tarjeta es un mensaje real que la persona recibe, con sus textos completos.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#888780"/></marker></defs>
<rect x="0" y="0" width="1620" height="900" fill="#FFFFFF"/>
<text x="20" y="36" font-size="20" font-weight="500" fill="#2C2C2A">Bot de comentarios · Bike Trust V2 — qué dice y cuándo</text>
<text x="20" y="58" font-size="12" fill="#5F5E5A">Cada tarjeta es un mensaje que la persona recibe. Los ⟨valores⟩ los completa el sistema solo, desde el inventario, según el video comentado.</text>
<rect x="20" y="76" width="250" height="30" rx="15" fill="#F1EFE8" stroke="#5F5E5A"/><text x="145" y="95" font-size="12.5" fill="#2C2C2A" text-anchor="middle">La persona comenta el reel</text>
<path d="M145,106 L145,122" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="122" width="490" height="78" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="36" y="144" font-size="13" font-weight="500" fill="#042C53">Respuesta pública, en el post</text><text x="36" y="163" font-size="12.5" fill="#0C447C">«Te escribí al DM 📩»</text><text x="36" y="180" font-size="11" fill="#5F5E5A">(rota entre 5 variantes para no repetirse)</text>
<path d="M145,200 L145,216" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="216" width="490" height="30" rx="15" fill="#FAEEDA" stroke="#854F0B"/><text x="265" y="235" font-size="12.5" font-weight="500" fill="#412402" text-anchor="middle">¿La bici del video sigue disponible?</text>
<path d="M145,246 L145,262" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="155" y="258" font-size="11" fill="#5F5E5A">ya se vendió</text>
<path d="M510,231 L540,231 L540,553 L510,553" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text transform="rotate(90 548 300)" x="548" y="300" font-size="11" fill="#5F5E5A">sigue disponible</text>
<rect x="20" y="262" width="490" height="200" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="36" y="284" font-size="13" font-weight="500" fill="#042C53">Si ya se vendió — lo confiesa al tiro</text><text x="36" y="303" font-size="12.5" fill="#0C447C">Hola 👋 Te soy derecho: esa unidad ya se vendió.</text><text x="36" y="320" font-size="12.5" fill="#0C447C">El video sigue dando vueltas 🙈</text><text x="36" y="354" font-size="12.5" fill="#0C447C">Pero si es la que andabas buscando, te la conseguimos.</text><text x="36" y="371" font-size="12.5" fill="#0C447C">Todas las semanas salimos a buscar modelos específicos</text><text x="36" y="388" font-size="12.5" fill="#0C447C">para gente que nos los encarga.</text><text x="36" y="422" font-size="12.5" fill="#0C447C">¿Te contactamos con nuestro especialista para que te asesore?</text><text x="36" y="446" font-size="12.5" font-weight="500" fill="#185FA5">[ Sí, que me llamen ]&#160;&#160;&#160;&#160;[ Ver lo que hay ahora ]</text>
<path d="M145,462 L145,488" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="170" y="478" font-size="11" fill="#5F5E5A">«que me llamen» → teléfono (col. der.) · «ver lo que hay» → catálogo</text>
<rect x="20" y="488" width="490" height="132" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="36" y="510" font-size="13" font-weight="500" fill="#042C53">Si está disponible — ofrece la ficha</text><text x="36" y="529" font-size="12.5" fill="#0C447C">Hola 👋 Vi tu comentario en la ⟨modelo⟩.</text><text x="36" y="563" font-size="12.5" fill="#0C447C">¿Quieres ver la ficha técnica con specs, precio y la nota</text><text x="36" y="580" font-size="12.5" fill="#0C447C">que sacó en nuestra inspección?</text><text x="36" y="604" font-size="12.5" font-weight="500" fill="#185FA5">[ Sí, muéstramela ]&#160;&#160;&#160;&#160;[ Tengo una consulta ]</text>
<path d="M145,620 L145,636" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="155" y="633" font-size="11" fill="#5F5E5A">«Tengo una consulta» · («Sí, muéstramela» → la ficha, col. central)</text>
<rect x="20" y="636" width="490" height="82" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="36" y="658" font-size="13" font-weight="500" fill="#042C53">El desvío de la consulta</text><text x="36" y="677" font-size="12.5" fill="#0C447C">Dime 🙂 ¿tu consulta es sobre esta bici o sobre la tienda?</text><text x="36" y="701" font-size="12.5" font-weight="500" fill="#185FA5">[ Sobre la bici ]&#160;&#160;&#160;&#160;[ Sobre la tienda ]</text>
<path d="M145,718 L145,744" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="165" y="738" font-size="11" fill="#5F5E5A">«Sobre la tienda» · («Sobre la bici» → vuelve a la ficha)</text>
<rect x="20" y="744" width="490" height="106" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="36" y="766" font-size="13" font-weight="500" fill="#042C53">La tienda</text><text x="36" y="785" font-size="12.5" fill="#0C447C">Estamos en Av. Las Condes 12461, Las Condes 📍</text><text x="36" y="802" font-size="12.5" fill="#0C447C">Lunes a viernes de 9:00 a 20:00, sábado de 10:00 a 14:00.</text><text x="36" y="836" font-size="12.5" fill="#0C447C">Y acá puedes ver todo lo que tenemos: biketrust.cl</text>
<text x="36" y="868" font-size="11" fill="#5F5E5A">…y 40 segundos después, igual le ofrece la llamada (columna central)</text>
<rect x="570" y="76" width="490" height="254" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="586" y="98" font-size="13" font-weight="500" fill="#042C53">La ficha técnica — el corazón</text><text x="586" y="117" font-size="12.5" fill="#0C447C">📷 ⟨foto de la bici⟩</text><text x="586" y="134" font-size="12.5" fill="#0C447C">⟨modelo⟩ · Talla ⟨talla⟩</text><text x="586" y="168" font-size="12.5" fill="#0C447C">Certificación: ⟨nota⟩/7 🔧</text><text x="586" y="185" font-size="12.5" fill="#0C447C">Donde perdió puntos: ⟨área más débil⟩</text><text x="586" y="219" font-size="12.5" fill="#0C447C">Estado honesto, tal cual está hoy:</text><text x="586" y="236" font-size="12.5" fill="#0C447C">⟨el estado real de la unidad, sin maquillaje⟩</text><text x="586" y="270" font-size="12.5" fill="#0C447C">Nueva hoy sale ⟨precio de nueva⟩.</text><text x="586" y="287" font-size="12.5" fill="#0C447C">Esta queda en ⟨precio⟩ → te ahorras ⟨ahorro⟩.</text><text x="586" y="311" font-size="12.5" font-weight="500" fill="#185FA5">[ Ver Ficha ]</text>
<path d="M815,330 L815,342" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="570" y="342" width="490" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="586" y="364" font-size="13" font-weight="500" fill="#04342C">Si es eléctrica, agrega antes del precio:</text><text x="586" y="383" font-size="12.5" fill="#085041">Diagnóstico de batería: ⟨salud⟩% de salud · ⟨ciclos⟩ ciclos.</text><text x="586" y="400" font-size="12.5" fill="#085041">Regla nuestra: bajo 80% no la vendemos.</text>
<path d="M815,418 L815,430" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="570" y="430" width="490" height="126" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="586" y="452" font-size="13" font-weight="500" fill="#042C53">«Ver lo que hay ahora» — el catálogo</text><text x="586" y="471" font-size="12.5" fill="#0C447C">Acá puedes ver todo lo que tenemos disponible ahora</text><text x="586" y="488" font-size="12.5" fill="#0C447C">mismo 👉 biketrust.cl</text><text x="586" y="522" font-size="12.5" fill="#0C447C">Todas pasaron por nuestra inspección, con su nota de 1 a 7</text><text x="586" y="539" font-size="12.5" fill="#0C447C">a la vista.</text>
<path d="M815,556 L815,568" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="570" y="568" width="490" height="30" rx="15" fill="#FBEAF0" stroke="#993556"/><text x="815" y="587" font-size="12.5" font-weight="500" fill="#4B1528" text-anchor="middle">⏱ 40 segundos después… (solo la primera vez)</text>
<path d="M815,598 L815,610" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="570" y="610" width="490" height="168" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="586" y="632" font-size="13" font-weight="500" fill="#042C53">La oferta de llamada</text><text x="586" y="651" font-size="12.5" fill="#0C447C">¿Te gustaría hablar directamente con un especialista por</text><text x="586" y="668" font-size="12.5" fill="#0C447C">teléfono para orientarte mejor?</text><text x="586" y="702" font-size="12.5" fill="#0C447C">Te resuelve las dudas que por chat no se responden bien: si</text><text x="586" y="719" font-size="12.5" fill="#0C447C">esa talla te calza, el historial completo de la unidad, y</text><text x="586" y="736" font-size="12.5" fill="#0C447C">cómo la despachamos si estás fuera de Santiago.</text><text x="586" y="760" font-size="12.5" font-weight="500" fill="#185FA5">[ Sí, que me llamen ]&#160;&#160;&#160;&#160;[ Por ahora no ]</text>
<text x="586" y="798" font-size="11" fill="#5F5E5A">«Sí, que me llamen» → pide el teléfono (columna derecha, arriba)</text>
<text x="586" y="814" font-size="11" fill="#5F5E5A">«Por ahora no» → despedida sin presión (columna derecha, abajo)</text>
<rect x="1120" y="76" width="480" height="140" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="1136" y="98" font-size="13" font-weight="500" fill="#042C53">Pide el teléfono</text><text x="1136" y="117" font-size="12.5" fill="#0C447C">Perfecto 🙌 ¿A qué número te llamamos?</text><text x="1136" y="151" font-size="12.5" fill="#0C447C">Escríbelo como quieras (9 1234 5678, +569…, da lo mismo).</text><text x="1136" y="185" font-size="11" fill="#5F5E5A">— si el número viene mal: «Creo que se cortó un dígito 🙈</text><text x="1136" y="201" font-size="11" fill="#5F5E5A">¿me lo mandas de nuevo? Así sirve: 9 1234 5678»</text>
<path d="M1360,216 L1360,232" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="1120" y="232" width="480" height="84" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="1136" y="254" font-size="13" font-weight="500" fill="#042C53">Confirma el número</text><text x="1136" y="273" font-size="12.5" fill="#0C447C">Anotado: ⟨número⟩ ✅</text><text x="1136" y="297" font-size="12.5" font-weight="500" fill="#185FA5">[ Correcto ]&#160;&#160;&#160;&#160;[ Corregir ]</text>
<text x="1136" y="332" font-size="11" fill="#5F5E5A">«Corregir» → lo pide de nuevo · «Correcto» → la confirmación</text>
<path d="M1360,316 L1360,346" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="1120" y="346" width="480" height="178" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="1136" y="368" font-size="13" font-weight="500" fill="#042C53">La confirmación — con hora prometida real</text><text x="1136" y="387" font-size="12.5" fill="#0C447C">Listo ✅ Te va a llamar Luis Sulbarán, nuestro especialista,</text><text x="1136" y="404" font-size="12.5" fill="#0C447C">⟨«en los próximos minutos» · «mañana a partir de las</text><text x="1136" y="421" font-size="12.5" fill="#0C447C">10:00»…⟩</text><text x="1136" y="455" font-size="12.5" fill="#0C447C">Te marca desde el +56 9 2181 5855 — guarda el número así</text><text x="1136" y="472" font-size="12.5" fill="#0C447C">sabes que somos nosotros 😉</text><text x="1136" y="506" font-size="12.5" fill="#0C447C">Si no te pilla, te deja un WhatsApp a ese mismo número.</text>
<rect x="1120" y="536" width="480" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1136" y="558" font-size="13" font-weight="500" fill="#042C53">Si ya había pedido que lo llamaran:</text><text x="1136" y="577" font-size="12.5" fill="#0C447C">Listo ✅ Ya tenía tu solicitud anotada — Luis te llama en</text><text x="1136" y="594" font-size="12.5" fill="#0C447C">cuanto pueda. (+ las mismas dos líneas de arriba)</text>
<rect x="1120" y="624" width="480" height="106" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="1136" y="646" font-size="13" font-weight="500" fill="#042C53">«Por ahora no» — despedida sin presión</text><text x="1136" y="665" font-size="12.5" fill="#0C447C">Dale, sin problema 👌 Cero llamadas.</text><text x="1136" y="699" font-size="12.5" fill="#0C447C">Cualquier duda me escribes por acá. Y si alguien la aparta</text><text x="1136" y="716" font-size="12.5" fill="#0C447C">antes, te aviso.</text>
<rect x="1120" y="742" width="480" height="106" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="1136" y="764" font-size="13" font-weight="500" fill="#26215C">Y si alguien pide que no le escriban</text><text x="1136" y="783" font-size="12.5" fill="#3C3489">Detecta «stop», «baja», «no me escriban», «no me molesten»…</text><text x="1136" y="817" font-size="12.5" fill="#3C3489">Listo, no te escribimos más 👌</text><text x="1136" y="834" font-size="11" fill="#5F5E5A">(y no se le vuelve a escribir nunca)</text>
<text x="20" y="890" font-size="11" fill="#888780">Versión para Roberto y Alfonso · 30-07-2026 · la versión técnica, con condiciones y conexiones, vive en el repositorio del proyecto.</text>
</svg>
